<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ArraiPay - Gerenciamento de Cartões</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para gerar os QR Codes dinamicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="container-card">
        <div class="topo-header">
            <h2>Gerenciamento de Cartões</h2>
            <button class="btn-incluir" onclick="abrirFormulario()">+ Incluir Novo Cartão</button>
        </div>

        <!-- FORMULÁRIO DE INCLUSÃO -->
        <div id="painelCadastro" class="painel-formulario" style="display: none;">
            <h3>Cadastrar Novo Cartão</h3>
            <div class="form-grupo">
                <label>Código QR Code (Automático):</label>
                <input type="text" id="inputCodigoQR" readonly>
            </div>
            <div class="form-grupo">
                <label>Nome do Participante (Opcional):</label>
                <input type="text" id="inputParticipante" placeholder="Ex: Maria Souza">
            </div>
            <div class="form-grupo">
                <label>Saldo Inicial (R$):</label>
                <input type="number" id="inputSaldo" value="0.00" step="0.01">
            </div>
            <button class="btn-salvar" onclick="salvarCartao()">Salvar Cartão</button>
            <button class="btn-cancelar" onclick="fecharFormulario()">Cancelar</button>
        </div>

        <!-- TABELA DE CARTÕES -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>QR Code</th>
                    <th>Participante</th>
                    <th>Status</th>
                    <th>Saldo Atual</th>
                    <th>Ações (Bloqueiar / Ativar)</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- MODAL DO QR CODE AMPLIADO -->
    <div id="modalQR" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <span class="fechar-modal" onclick="fecharModalQR()">&times;</span>
            <h3>Cartão ArraiPay</h3>
            <p id="qrParticipante" class="texto-participante"></p>
            
            <!-- Onde o QR Code grandão será desenhado -->
            <div id="qrCodeGrande" class="box-qr"></div>

            <p id="qrCodigoTexto" class="codigo-destaque"></p>
            <button class="btn-imprimir" onclick="window.print()">Imprimir Cartão</button>
        </div>
    </div>

    <!-- CONECTANDO O SEU SCRIPT EXTERNO -->
    <script src="script.js"></script>
</body>
</html>
